
format = """$username$hostname$directory$git_branch$git_state$git_status$cmd_duration$rust$python$c$status$line_break\
$character"""

[directory]
style = 'blue'
read_only = ' r/o'

[character]
success_symbol = '[❯](purple)'
error_symbol = '[❯](red)'

[status]
disabled = false
style = 'red'
format = '[$hex_status]($style) $signal_symbol'
map_symbol = true

[git_branch]
format = '[$branch]($style)'
style = 'bright-black'

[git_status]
ahead = '⇡${count}'
diverged = ' ⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
format = '[[($conflicte$renamed$modified$deleted$staged$untracked)](218)($stashed$diverged)]($style) '
style = 'cyan'
# conflicted = '​'
# untracked = '​'
# modified = '​'
# staged = '​'
# renamed = '​'
# deleted = '​'
deleted = '-'
modified = '*'
staged = '+'
conflicted = '!'
stashed = ' ≡'

[git_state]
format = '\([$state($progress_current/$progress_total)]($style)\)'
style = 'bright-black'

[cmd_duration]
format = '[$duration]($style) '
style = 'yellow'

[python]
symbol = 'py '

[rust]
symbol = 'rs '

[c]
format = "via [$symbol]($style)"

[nodejs]
symbol = 'nodejs'